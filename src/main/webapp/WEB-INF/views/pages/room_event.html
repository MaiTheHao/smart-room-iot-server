<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout.html}">
  <head>
    <title th:text="|#{room.event.title} - ${room.name != null ? room.name : '--'}|">Room Events</title>
    <!-- Tabulator CSS -->
    <link rel="stylesheet" th:href="@{/css/lib/tabulator.min.css}" />
    <style>
      .btn-back {
        background: none;
        border: 1px solid #dee2e6;
        color: #6c757d;
        transition: all 0.2s;
      }
      .btn-back:hover {
        background-color: #f1f3f5;
        color: #343a40;
      }
    </style>
  </head>

  <div layout:fragment="header-title">
    <span th:text="#{room.event.title}">Room Events</span>
  </div>

  <div layout:fragment="content">
    <div class="container-fluid">
      <!-- ═══ 1. Header Info Card ═══ -->
      <div class="card shadow-sm border-0 mb-4 rounded-4">
        <div class="card-header bg-white border-0 pt-3 pb-0">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div class="d-flex align-items-center">
              <div>
                <div class="d-flex align-items-center gap-2">
                  <h4 class="mb-0 fw-bold text-dark" th:text="${room.name}">Room Name</h4>
                  <span class="badge bg-secondary-subtle text-secondary border px-2 py-1 small rounded-pill font-monospace">
                    #<span th:text="${room.id}">0</span>
                  </span>
                  <span class="badge bg-light text-muted border px-2 py-1 small rounded-pill font-monospace">
                    <i data-lucide="cpu" class="lucide-sm me-1"></i>
                    <span th:text="${room.code}">--</span>
                  </span>
                </div>
                <div class="text-muted small mt-1" th:text="#{room.event.subtitle}">Cấu hình phản hồi tự động khi phát sinh sự kiện</div>
              </div>
            </div>
            <div>
              <a th:href="@{/rooms/{id}(id=${room.id})}" class="btn btn-sm btn-back px-3 rounded-pill d-inline-flex align-items-center shadow-sm">
                <i data-lucide="arrow-left" class="lucide-sm me-1"></i>
                <span th:text="#{error.back}">Back</span>
              </a>
            </div>
          </div>
        </div>
        <div class="card-body pt-2 pb-3">
          <div class="d-flex flex-wrap gap-4 text-muted small">
            <div>
              <span class="fw-semibold me-1" th:text="#{smart_system.rule.conditions.ds.room}">Room:</span>
              <span class="fw-bold text-dark" th:text="${room.name}">Room Name</span>
              <input type="hidden" id="roomId" th:value="${room.id}" />
            </div>
            <div>
              <span class="fw-semibold me-1">Room Code:</span>
              <span class="font-monospace text-dark" th:text="${room.code}">--</span>
            </div>
          </div>
        </div>
      </div>

      <!-- ═══ 2. Room Events Master Table Card ═══ -->
      <div class="card rounded-4 border-0 shadow-sm mb-4">
        <div class="card-header bg-white border-bottom-0 py-3">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h6 class="fw-bold m-0 d-flex align-items-center">
              <i data-lucide="radio" class="text-primary me-2 lucide-sm"></i>
              <span th:text="#{room.event.title}">Room Events</span>
            </h6>
            <div class="card-tools d-flex align-items-center gap-2">
              <button type="button" class="btn btn-outline-primary btn-sm rounded-pill px-3 shadow-sm" id="btnReload">
                <i data-lucide="refresh-cw" class="lucide-sm me-1"></i>
                <span th:text="#{common.reload}">Reload</span>
              </button>
              <button type="button" class="btn btn-danger btn-sm rounded-pill px-3 shadow-sm" id="btnDeleteSelected" disabled>
                <i data-lucide="trash-2" class="lucide-sm me-1"></i>
                <span th:text="#{common.delete}">Delete</span>
              </button>
              <button type="button" class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm" id="btnAddConfig">
                <i data-lucide="plus" class="lucide-sm me-1"></i>
                <span th:text="#{common.add}">Thêm sự kiện</span>
              </button>
            </div>
          </div>
        </div>
        <div class="card-body p-0">
          <div id="roomEventsTable"></div>
        </div>
      </div>
    </div>

    <!-- ════════════ Config Modal: Thêm / Sửa Cấu hình Sự kiện ════════════ -->
    <div class="modal fade" id="roomEventConfigModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
          <div class="modal-header border-0 pb-0 pt-4 px-4">
            <h5 class="modal-title fw-bold d-flex align-items-center">
              <i data-lucide="settings" class="text-primary me-2 lucide-md"></i>
              <span id="configModalTitle">Cài đặt sự kiện</span>
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form id="configForm" novalidate>
            <div class="modal-body py-4 px-4">
              <input type="hidden" id="cfgConfigId" />
              <div class="row g-3">
                <!-- Mã sự kiện -->
                <div class="col-12" id="cfgEventCodeGroup">
                  <label for="cfgEventCode" class="form-label fw-semibold small text-muted text-uppercase mb-1">Mã sự kiện</label>
                  <select class="form-select bg-light border-0" id="cfgEventCode" required>
                    <option value="" disabled selected>-- Chọn mã sự kiện --</option>
                  </select>
                  <div class="invalid-feedback" id="val-cfgEventCode">Vui lòng chọn mã sự kiện.</div>
                </div>

                <!-- Cooldown -->
                <div class="col-12">
                  <label for="cfgCooldown" class="form-label fw-semibold small text-muted text-uppercase mb-1">Thời gian giãn cách (Cooldown: giây)</label>
                  <input type="number" class="form-control bg-light border-0 font-monospace" id="cfgCooldown" min="0" value="60" required />
                  <div class="invalid-feedback" id="val-cfgCooldown">Thời gian cooldown phải lớn hơn hoặc bằng 0.</div>
                </div>

                <!-- IsActive Switch -->
                <div class="col-12">
                  <div class="form-check form-switch pt-2">
                    <input class="form-check-input" type="checkbox" role="switch" id="cfgIsActive" checked />
                    <label class="form-check-label fw-semibold small" for="cfgIsActive">Kích hoạt sự kiện này</label>
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer border-0 pt-0 pb-4 px-4">
              <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal" th:text="#{logout.cancel.button}">Hủy</button>
              <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm d-inline-flex align-items-center">
                <i data-lucide="check" class="lucide-sm me-1"></i>
                <span th:text="#{index.scene.trigger.confirm}">Xác nhận</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- ════════════ SCRIPTS ════════════ -->
  <th:block layout:fragment="scripts">
    <script th:inline="javascript">
      window.__ROOM_EVENT_PAGE_CONFIG__ = {
        roomId: /*[[${room.id}]]*/ 0,
        roomName: /*[[${room.name}]]*/ '',
        roomCode: /*[[${room.code}]]*/ '',
        i18n: {
          colCode: 'Sự kiện',
          colCooldown: 'Cooldown (s)',
          colStatus: 'Trạng thái',
          colActions: 'Thao tác',
          noData: 'Chưa có cấu hình sự kiện nào.',
          confirmDelete: /*[[#{room.event.confirm_delete}]]*/ 'Xác nhận xóa',
          confirmDeleteText: /*[[#{room.event.confirm_delete_text}]]*/ 'Bạn có chắc chắn muốn xóa cấu hình sự kiện này cùng tất cả điều kiện và hành động liên quan?',
          saveSuccess: /*[[#{room.event.save_success}]]*/ 'Đã lưu cấu hình sự kiện phòng thành công!',
          saveError: /*[[#{room.event.save_error}]]*/ 'Lưu cấu hình thất bại!',
          conflictError: /*[[#{room.event.conflict_error}]]*/ 'Cấu hình sự kiện đã tồn tại!',
          yesDelete: /*[[#{common.yes_delete}]]*/ 'Xóa',
          cancel: /*[[#{logout.cancel.button}]]*/ 'Hủy',
          editTitle: /*[[#{room.event.modal.edit_title}]]*/ 'Cập nhật cấu hình sự kiện',
          addTitle: /*[[#{room.event.modal.add_title}]]*/ 'Thêm cấu hình sự kiện',
          selectEventCode: /*[[#{room.event.modal.select_code}]]*/ '-- Chọn mã sự kiện --',
          createSuccess: /*[[#{room.event.modal.create_success}]]*/ 'Đã tạo mới cấu hình sự kiện',
          updateSuccess: /*[[#{room.event.modal.update_success}]]*/ 'Đã cập nhật cấu hình sự kiện',
          createError: /*[[#{room.event.modal.create_error}]]*/ 'Tạo cấu hình thất bại',
          updateError: /*[[#{room.event.modal.update_error}]]*/ 'Cập nhật cấu hình thất bại',
          deleteSuccess: /*[[#{room.event.delete_success}]]*/ 'Đã xóa cấu hình sự kiện',
          deleteError: /*[[#{room.event.delete_error}]]*/ 'Xóa cấu hình sự kiện thất bại',
          updateStatusError: /*[[#{room.event.update_status_error}]]*/ 'Không thể cập nhật trạng thái',
          batchDeleteSuccess: /*[[#{room.event.batch_delete_success}]]*/ 'Đã xóa các cấu hình sự kiện đã chọn',
          batchDeleteConfirm: /*[[#{room.event.batch_delete_confirm}]]*/ 'Xóa {0} cấu hình sự kiện đã chọn?',
          titleConditions: /*[[#{room.event.action.conditions}]]*/ 'Điều kiện',
          titleActions: /*[[#{room.event.action.actions}]]*/ 'Hành động',
          titleSettings: /*[[#{room.event.action.settings}]]*/ 'Cài đặt',
          titleDelete: /*[[#{room.event.action.delete}]]*/ 'Xóa',
          error: /*[[#{smart_system.rule.error}]]*/ 'Lỗi',
          success: /*[[#{smart_system.rule.success}]]*/ 'Thành công',
        }
      };
    </script>
    <script type="module" th:src="@{/js/pages/room_event/index.js}"></script>
  </th:block>
</html>
